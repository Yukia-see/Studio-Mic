<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181f"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#2dd4bf" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Subtle grid lines -->
  <line x1="80" y1="256" x2="432" y2="256" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="256" y1="80" x2="256" y2="432" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Soundwave visualizer bars on left & right -->
  <g opacity="0.6">
    <rect x="96" y="226" width="12" height="60" rx="6" fill="#38bdf8"/>
    <rect x="120" y="196" width="12" height="120" rx="6" fill="#38bdf8"/>
    <rect x="144" y="166" width="12" height="180" rx="6" fill="#2dd4bf"/>

    <rect x="356" y="166" width="12" height="180" rx="6" fill="#2dd4bf"/>
    <rect x="380" y="196" width="12" height="120" rx="6" fill="#34d399"/>
    <rect x="404" y="226" width="12" height="60" rx="6" fill="#34d399"/>
  </g>

  <!-- Central Studio Microphone Capsule -->
  <g filter="url(#glow)">
    <!-- Mic Body Capsule -->
    <rect x="206" y="128" width="100" height="160" rx="50" fill="url(#primaryGrad)"/>
    <!-- Capsule mesh grill division -->
    <path d="M 206,196 L 306,196" stroke="#0a0d12" stroke-width="5" stroke-opacity="0.4"/>
    <path d="M 206,206 L 306,206" stroke="#ffffff" stroke-width="3" stroke-opacity="0.3"/>
    
    <!-- Capsule inner shadow/accent -->
    <rect x="216" y="138" width="80" height="50" rx="25" fill="#ffffff" fill-opacity="0.2"/>

    <!-- U-shaped cradle holder -->
    <path d="M 186,220 C 186,305 326,305 326,220" fill="none" stroke="url(#primaryGrad)" stroke-width="18" stroke-linecap="round"/>

    <!-- Stand Stem -->
    <line x1="256" y1="298" x2="256" y2="356" stroke="url(#primaryGrad)" stroke-width="18" stroke-linecap="round"/>

    <!-- Stand Base -->
    <rect x="196" y="356" width="120" height="20" rx="10" fill="url(#primaryGrad)"/>
  </g>
</svg>
