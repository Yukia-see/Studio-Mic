# Studio Mic Tier-1 buses (PipeWire drop-in).
# Installed to /usr/share/pipewire/pipewire.conf.d/ (packages) or ~/.config/pipewire/pipewire.conf.d/
# (user install). These nodes exist from login onward, so OBS and Discord can bind to them before
# Studio Mic starts, and they survive `systemctl --user restart pipewire`. Studio Mic reuses them;
# without this file it creates the same nodes on demand (object.linger = true).
# 48 kHz stereo, never suspended. studiomic_processed_mic is the legacy name used by older OBS
# scenes and Discord settings; it carries the same signal as StudioMic_Voice_Out.
context.objects = [
    { factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "StudioMic_Voice_Out"
            node.description        = "Studio Mic (Microphone Only)"
            media.class             = "Audio/Source/Virtual"
            audio.position          = [ FL FR ]
            audio.rate              = 48000
            node.pause-on-idle      = false
            monitor.channel-volumes = true
            priority.session        = 0
            priority.driver         = 0
            node.group              = studiomic
            object.linger           = true
        }
    }
    { factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "StudioMic_Stream_Mix"
            node.description        = "Studio Mic (Stream Mix)"
            media.class             = "Audio/Source/Virtual"
            audio.position          = [ FL FR ]
            audio.rate              = 48000
            node.pause-on-idle      = false
            monitor.channel-volumes = true
            priority.session        = 0
            priority.driver         = 0
            node.group              = studiomic
            object.linger           = true
        }
    }
    { factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "StudioMic_VOD_Mix"
            node.description        = "Studio Mic (VOD Track - DMCA Safe)"
            media.class             = "Audio/Source/Virtual"
            audio.position          = [ FL FR ]
            audio.rate              = 48000
            node.pause-on-idle      = false
            monitor.channel-volumes = true
            priority.session        = 0
            priority.driver         = 0
            node.group              = studiomic
            object.linger           = true
        }
    }
    { factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "StudioMic_Monitor_Mix"
            node.description        = "Studio Mic (Monitor Mix)"
            media.class             = "Audio/Sink"
            audio.position          = [ FL FR ]
            audio.rate              = 48000
            node.pause-on-idle      = false
            monitor.channel-volumes = true
            priority.session        = 0
            priority.driver         = 0
            node.group              = studiomic
            object.linger           = true
        }
    }
    { factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "studiomic_processed_mic"
            node.description        = "Studio Mic (Legacy Alias)"
            media.class             = "Audio/Source/Virtual"
            audio.position          = [ FL FR ]
            audio.rate              = 48000
            node.pause-on-idle      = false
            monitor.channel-volumes = true
            priority.session        = 0
            priority.driver         = 0
            node.group              = studiomic
            object.linger           = true
        }
    }
]
